name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shared:
    name: Shared rules (type check and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test
